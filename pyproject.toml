[project]
name = "zero-crop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.3",
    "matplotlib>=3.10.8",
    "pymupdf>=1.27.2.2",
    "rasterio>=1.5.0",
    "rasterstats>=0.20.0",
    "transformers>=5.3.0",
    "wikipedia>=1.4.0",
    "diffusers==0.30.0",
    "huggingface_hub>=0.24.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.6",
    "opencv-contrib-python>=4.10.0.84,<4.12",
    "opencv-python>=4.10.0.84,<4.12",
    "plotly>=6.3.1",
    "scikit-image>=0.25.2",
    "tqdm>=4.67.1",
    "accelerate>=1.11.0",
    "addict",
    "easydict",
    "einops",
    "gradio_client",
    "pdf2image",
    "pillow>=12.0.0",
    "pytesseract>=0.3.13",
    "requests",
    "tokenizers>=0.20.3",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
    "pytest>=8.4.2",
    "seaborn>=0.13.2",
    "scikit-learn>=1.7.2",
    "pymilvus>=2.6.3",
    "peft>=0.13.2",
    "hdbscan>=0.8.40",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "umap-learn>=0.5.11",
    "scienceplots>=2.2.1",
    "pyarrow>=23.0.1",
]

[tool.uv]
# Research/Application mode (not a package)
package = false
managed = true
# Restrict resolution to x86_64 Linux only (RTX 5090 machine)
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pyright]
venvPath = "."
venv = ".venv"

